name: System Core Service

on:
  workflow_dispatch:
  schedule:
    # Runs every 5 hours
    - cron: '0 */5 * * *'

concurrency:
  group: core-runner
  cancel-in-progress: false

jobs:
  core-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get cache week key
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Container Image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: /tmp/jellyfin.tar.gz
          key: jellyfin-image-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: jellyfin-image-${{ runner.os }}-

      - name: Pull & Save Container Image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          docker pull lscr.io/linuxserver/jellyfin:latest
          docker save lscr.io/linuxserver/jellyfin:latest | gzip > /tmp/jellyfin.tar.gz

      - name: Load Container Image
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/jellyfin.tar.gz

      - name: Restore LUKS2 Encrypted Volume
        env:
          HFGAG_TOKEN: ${{ secrets.HFGAG }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
          LUKS_PASSPHRASE: ${{ secrets.LUKS_PASSPHRASE }}
        run: |
          IMG_NAME="sys-core.bin"
          BACKUP_DIR="/tmp/hf-backup"
          IMG_PATH="$BACKUP_DIR/$IMG_NAME"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          IMG_SIZE="200G"

          mkdir -p "$MOUNT_DIR" "$BACKUP_DIR"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils cryptsetup yt-dlp > /dev/null 2>&1

          pip install -U "huggingface_hub[cli]" -q
          hf auth login --token "$HFGAG_TOKEN" > /dev/null 2>&1

          echo "☁️ Syncing container down from Public HF Repo..."
          hf sync "hf://$PUBLIC_REPO" "$BACKUP_DIR" || true

          sudo modprobe nbd max_part=8

          if [ -f "$IMG_PATH" ]; then
            echo "📦 Unlocking existing encrypted volume..."
            sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
            sleep 2
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup open --allow-discards --key-file - /dev/nbd0 encrypted_vol
          else
            echo "🆕 Provisioning container..."
            qemu-img create -f qcow2 "$IMG_PATH" "$IMG_SIZE"
            sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
            sleep 2
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup luksFormat -q --type luks2 --cipher aes-xts-plain64 --key-size 512 --pbkdf argon2id /dev/nbd0 --key-file -
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup open --allow-discards --key-file - /dev/nbd0 encrypted_vol
            sudo mkfs.ext4 -F /dev/mapper/encrypted_vol
          fi

          sudo mount /dev/mapper/encrypted_vol "$MOUNT_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$MOUNT_DIR"

      - name: Apply Subsystem Themes
        run: |
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          mkdir -p "$MOUNT_DIR/custom-cont-init.d"
          curl -sSL -o "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh" \
            https://raw.githubusercontent.com/AumGupta/abyss-jellyfin/main/scripts/docker/abyss-spotlight.sh
          chmod +x "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh"

      - name: Generate Stream Indices
        env:
          M3U_URL: ${{ secrets.M3 }}
          STRM_OUT: "${{ github.workspace }}/jellyfin-config/media"
          CACHE_DB: "${{ github.workspace }}/jellyfin-config/data/m3u2strm_cache.db"
        run: |
          if [ -n "$M3U_URL" ]; then
            mkdir -p "${{ github.workspace }}/jellyfin-config/media"
            pip install requests -q
            python3 generate_strm.py || true
          fi

      - name: Sync External Audio
        env:
          HF_ORIGINAL_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MUSIC_DIR="${{ github.workspace }}/jellyfin-config/media/Music"
          mkdir -p "$MUSIC_DIR"
          hf auth login --token "$HF_ORIGINAL_TOKEN" > /dev/null 2>&1
          hf sync "hf://buckets/solariy/music" "$MUSIC_DIR" || true

      - name: Launch Container
        run: |
          docker run -d \
            --name jellyfin \
            --network=host \
            -e PUID=$(id -u) \
            -e PGID=$(id -g) \
            -e TZ=Etc/UTC \
            -v "${{ github.workspace }}/jellyfin-config:/config" \
            -v "${{ github.workspace }}/jellyfin-config/media:/media:ro" \
            lscr.io/linuxserver/jellyfin:latest

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8096/health > /dev/null 2>&1; then
              echo "✅ Service ready!"
              break
            fi
            sleep 2
          done

      - name: Connect Secure Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb > /dev/null 2>&1
          rm cloudflared-linux-amd64.deb

          python3 -c "
          import base64, json, os
          token = os.environ['TUNNEL_TOKEN']
          domain = os.environ.get('DOMAIN_NAME', '')
          data = json.loads(base64.b64decode(token + '=' * (-len(token) % 4)).decode('utf-8'))
          
          creds = {
              'AccountTag': data['a'],
              'TunnelID': data['t'],
              'TunnelSecret': data['s']
          }
          
          os.makedirs('/home/runner/.cloudflared', exist_ok=True)
          with open(f'/home/runner/.cloudflared/{data[\"t\"]}.json', 'w') as f:
              json.dump(creds, f)
          
          ingress_rule = f'- hostname: {domain}\n    service: http://localhost:8096' if domain else '- service: http://localhost:8096'
          
          config = f'''tunnel: {data[\"t\"]}
          credentials-file: /home/runner/.cloudflared/{data[\"t\"]}.json

          ingress:
            {ingress_rule}
            - service: http_status:404
          '''
          with open('/home/runner/.cloudflared/config.yml', 'w') as f:
              f.write(config)
          "

          nohup cloudflared tunnel --config ~/.cloudflared/config.yml run > /dev/null 2>&1 &
          sleep 5
          sleep 17400   # ~4h50m runtime

      - name: Sync & Commit Volume Back
        if: always()
        env:
          HFGAG_TOKEN: ${{ secrets.HFGAG }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
        run: |
          BACKUP_DIR="/tmp/hf-backup"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"

          docker stop jellyfin || true
          sync

          sudo fstrim -v "$MOUNT_DIR" || true
          sudo umount "$MOUNT_DIR" || true
          sudo cryptsetup close encrypted_vol || true
          sudo qemu-nbd --disconnect /dev/nbd0 || true

          hf auth login --token "$HFGAG_TOKEN" > /dev/null 2>&1
          echo "☁️ Syncing core storage image back..."
          hf sync "$BACKUP_DIR" "hf://$PUBLIC_REPO"
