name: Public Jellyfin Server (Docker)

on:
  workflow_dispatch:
  schedule:
    # Runs every 5 hours (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: '0 */5 * * *'

# Ensures seamless handoff: Job #2 waits for Job #1 to finish and push data before starting
concurrency:
  group: jellyfin-runner
  cancel-in-progress: false

jobs:
  jellyfin-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Get cache week key
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Jellyfin Docker Image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: /tmp/jellyfin.tar.gz
          key: jellyfin-image-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: jellyfin-image-${{ runner.os }}-

      - name: Pull & Save Image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          docker pull lscr.io/linuxserver/jellyfin:latest
          docker save lscr.io/linuxserver/jellyfin:latest | gzip > /tmp/jellyfin.tar.gz

      - name: Load Image
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/jellyfin.tar.gz

      - name: Restore Jellyfin Config & Metadata (qcow2 virtual drive)
        run: |
          IMG_PATH="${{ github.workspace }}/jellyfin-data.qcow2"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          IMG_SIZE="100G"

          mkdir -p "$MOUNT_DIR"
          mkdir -p /tmp/hf-backup

          echo "🔧 Installing qemu tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils

          echo "📦 Installing Hugging Face CLI..."
          pip install -U "huggingface_hub[cli]"
          hf auth login --token "${{ secrets.HF_TOKEN }}"

          echo "☁️ Downloading backup image from Hugging Face Bucket..."
          hf sync "hf://buckets/solariy/sss" "/tmp/hf-backup" || true

          if [ -f "/tmp/hf-backup/jellyfin-data.qcow2" ]; then
            echo "📦 Found existing qcow2 image..."
            mv "/tmp/hf-backup/jellyfin-data.qcow2" "$IMG_PATH"
            qemu-img info "$IMG_PATH"
          else
            echo "🆕 No existing image found, creating a fresh qcow2..."
            qemu-img create -f qcow2 "$IMG_PATH" "$IMG_SIZE"
            sudo modprobe nbd max_part=8
            sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
            sudo mkfs.ext4 -F /dev/nbd0
            sudo qemu-nbd --disconnect /dev/nbd0
          fi

          echo "🔌 Connecting qcow2 via qemu-nbd..."
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
          sleep 1
          sudo mount /dev/nbd0 "$MOUNT_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$MOUNT_DIR"

          echo "💽 Disk space after restore:"
          df -h "${{ github.workspace }}"

      - name: Install Abyss Spotlight Theme (init script)
        run: |
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          mkdir -p "$MOUNT_DIR/custom-cont-init.d"
          curl -sSL -o "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh" \
            https://raw.githubusercontent.com/AumGupta/abyss-jellyfin/main/scripts/docker/abyss-spotlight.sh
          chmod +x "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh"
          echo "✅ Abyss init script installed"

      - name: Generate Xtream .strm Library
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          STRM_OUT: "${{ github.workspace }}/jellyfin-config/media"
          CACHE_DB: "${{ github.workspace }}/jellyfin-config/data/m3u2strm_cache.db"
        run: |
          if [ -z "$M3U_URL" ]; then
            echo "ℹ️ No M3U_URL secret set — skipping strm generation"
          else
            mkdir -p "${{ github.workspace }}/jellyfin-config/media"
            pip install requests -q
            python3 generate_strm.py
          fi

      - name: Sync Music Library from Hugging Face (Incremental)
        run: |
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          MUSIC_DIR="$MOUNT_DIR/media/Music"
          mkdir -p "$MUSIC_DIR"

          echo "🎵 Syncing music library (pulling new tracks only)..."
          hf sync "hf://buckets/solariy/music" "$MUSIC_DIR"
          echo "✅ Music sync complete"

      - name: Start Jellyfin
        run: |
          docker run -d \
            --name jellyfin \
            --network=host \
            -e PUID=$(id -u) \
            -e PGID=$(id -g) \
            -e TZ=Etc/UTC \
            -v "${{ github.workspace }}/jellyfin-config:/config" \
            -v "${{ github.workspace }}/jellyfin-config/media:/media:ro" \
            lscr.io/linuxserver/jellyfin:latest

          echo "⏳ Waiting for Jellyfin to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8096/health > /dev/null 2>&1; then
              echo "✅ Jellyfin is up!"
              break
            fi
            sleep 2
          done

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Launch Tunnel & Update Link
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          nohup cloudflared tunnel --url http://localhost:8096 --no-chunked-encoding > cloudflare.log 2>&1 &
          sleep 8
          CF_URL=$(grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -1)
          if [ -z "$CF_URL" ]; then
            echo "Failed to get tunnel URL, log contents:"
            cat cloudflare.log
            exit 1
          fi
          echo "Tunnel URL: $CF_URL"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$WORKER_URL/_update" \
            -H "x-auth: $WORKER_SECRET" \
            --data "$CF_URL")
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Worker response: $BODY (status $STATUS)"

          if [ "$STATUS" != "200" ]; then
            echo "Failed to update Worker KV"
            exit 1
          fi

          echo "Successfully pushed to Worker KV"

          sleep 17400   # ~4h50m runner uptime

      - name: Notify Worker job is done
        if: always()
        run: |
          curl -s -X POST "https://cool.sulus.workers.dev/_done" \
            -H "x-auth: ${{ secrets.WORKER_SECRET }}"

      - name: Safe Shutdown & Push to Hugging Face
        if: always()
        run: |
          IMG_PATH="${{ github.workspace }}/jellyfin-data.qcow2"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"

          docker stop jellyfin || true
          sync

          echo "✂️ Trimming filesystem to release deleted blocks..."
          sudo fstrim -v "$MOUNT_DIR" || true

          sudo umount "$MOUNT_DIR"
          sudo qemu-nbd --disconnect /dev/nbd0

          SIZE=$(du -sh "$IMG_PATH" | cut -f1)
          echo "📦 Real qcow2 size after compaction: $SIZE"
          qemu-img info "$IMG_PATH"

          echo "☁️ Uploading to Hugging Face Bucket..."
          mkdir -p /tmp/hf-backup
          mv "$IMG_PATH" /tmp/hf-backup/jellyfin-data.qcow2
          hf sync "/tmp/hf-backup" "hf://buckets/solariy/sss"
