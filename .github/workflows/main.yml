name: Public Server (Docker)

on:
  workflow_dispatch:
  schedule:
    # Runs every 5 hours
    - cron: '0 */5 * * *'

concurrency:
  group: jellyfin-runner
  cancel-in-progress: false

jobs:
  jellyfin-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get cache week key
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Jellyfin Docker Image
        id: cache-image
        uses: actions/cache@v4
        with:
          path: /tmp/jellyfin.tar.gz
          key: jellyfin-image-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: jellyfin-image-${{ runner.os }}-

      - name: Pull & Save Image
        if: steps.cache-image.outputs.cache-hit != 'true'
        run: |
          docker pull lscr.io/linuxserver/jellyfin:latest
          docker save lscr.io/linuxserver/jellyfin:latest | gzip > /tmp/jellyfin.tar.gz

      - name: Load Image
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/jellyfin.tar.gz

      - name: Restore LUKS2 Encrypted Config (qcow2 virtual drive)
        env:
          HFGAG_TOKEN: ${{ secrets.HFGAG }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
          LUKS_PASSPHRASE: ${{ secrets.LUKS_PASSPHRASE }}
        run: |
          IMG_NAME="sys-core.bin"
          IMG_PATH="${{ github.workspace }}/$IMG_NAME"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          IMG_SIZE="200G"

          mkdir -p "$MOUNT_DIR"
          mkdir -p /tmp/hf-backup

          echo "🔧 Installing qemu & cryptsetup tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils cryptsetup yt-dlp

          echo "📦 Installing Hugging Face CLI..."
          pip install -U "huggingface_hub[cli]" -q
          hf auth login --token "$HFGAG_TOKEN"

          echo "☁️ Downloading backup from Public HF Repo ($PUBLIC_REPO)..."
          hf sync "hf://$PUBLIC_REPO" "/tmp/hf-backup" || true

          sudo modprobe nbd max_part=8

          if [ -f "/tmp/hf-backup/$IMG_NAME" ]; then
            echo "📦 Found existing encrypted image..."
            mv "/tmp/hf-backup/$IMG_NAME" "$IMG_PATH"
            sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
            sleep 2

            echo "🔓 Unlocking LUKS2 encrypted volume..."
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup open --key-file - /dev/nbd0 encrypted_vol
          else
            echo "🆕 Creating new sparse qcow2 ($IMG_SIZE)..."
            qemu-img create -f qcow2 "$IMG_PATH" "$IMG_SIZE"
            sudo qemu-nbd --connect=/dev/nbd0 "$IMG_PATH"
            sleep 2

            echo "🔐 Formatting new drive with LUKS2..."
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup luksFormat -q --type luks2 --cipher aes-xts-plain64 --key-size 512 --pbkdf argon2id /dev/nbd0 --key-file -
            
            echo "🔓 Opening new LUKS2 container..."
            echo -n "$LUKS_PASSPHRASE" | sudo cryptsetup open --key-file - /dev/nbd0 encrypted_vol
            
            echo "💽 Formatting ext4 filesystem..."
            sudo mkfs.ext4 -F /dev/mapper/encrypted_vol
          fi

          echo "🔌 Mounting encrypted filesystem..."
          sudo mount /dev/mapper/encrypted_vol "$MOUNT_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$MOUNT_DIR"

          echo "💽 Disk space after LUKS restore:"
          df -h "$MOUNT_DIR"

      - name: Install Abyss Spotlight Theme (init script)
        run: |
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"
          mkdir -p "$MOUNT_DIR/custom-cont-init.d"
          curl -sSL -o "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh" \
            https://raw.githubusercontent.com/AumGupta/abyss-jellyfin/main/scripts/docker/abyss-spotlight.sh
          chmod +x "$MOUNT_DIR/custom-cont-init.d/abyss-spotlight.sh"

      - name: Generate Xtream .strm Library (Stored in Encrypted Drive)
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          STRM_OUT: "${{ github.workspace }}/jellyfin-config/media"
          CACHE_DB: "${{ github.workspace }}/jellyfin-config/data/m3u2strm_cache.db"
        run: |
          if [ -n "$M3U_URL" ]; then
            mkdir -p "${{ github.workspace }}/jellyfin-config/media"
            pip install requests -q
            python3 generate_strm.py || true
          fi

      - name: Sync Music Library from Hugging Face (Stored in Encrypted Drive)
        env:
          HF_ORIGINAL_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MUSIC_DIR="${{ github.workspace }}/jellyfin-config/media/Music"
          mkdir -p "$MUSIC_DIR"
          hf auth login --token "$HF_ORIGINAL_TOKEN"
          hf sync "hf://buckets/solariy/music" "$MUSIC_DIR" || true

      - name: Start Jellyfin
        run: |
          docker run -d \
            --name jellyfin \
            --network=host \
            -e PUID=$(id -u) \
            -e PGID=$(id -g) \
            -e TZ=Etc/UTC \
            -v "${{ github.workspace }}/jellyfin-config:/config" \
            -v "${{ github.workspace }}/jellyfin-config/media:/media:ro" \
            lscr.io/linuxserver/jellyfin:latest

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8096/health > /dev/null 2>&1; then
              echo "✅ Jellyfin is ready!"
              break
            fi
            sleep 2
          done

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Launch Tunnel & Update Link
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          nohup cloudflared tunnel --url http://localhost:8096 --no-chunked-encoding > cloudflare.log 2>&1 &
          sleep 8
          CF_URL=$(grep -o 'https://.*\.trycloudflare\.com' cloudflare.log | head -1)
          
          curl -s -X POST "$WORKER_URL/_update" -H "x-auth: $WORKER_SECRET" --data "$CF_URL"
          sleep 17400   # ~4h50m runtime

      - name: Notify Worker job is done
        if: always()
        run: |
          curl -s -X POST "https://cool.sulus.workers.dev/_done" \
            -H "x-auth: ${{ secrets.WORKER_SECRET }}"

      - name: Safe Shutdown, Trim, Compress & Push Encrypted Drive
        if: always()
        env:
          HFGAG_TOKEN: ${{ secrets.HFGAG }}
          PUBLIC_REPO: ${{ secrets.PUBLIC_REPO }}
        run: |
          IMG_NAME="sys-core.bin"
          IMG_PATH="${{ github.workspace }}/$IMG_NAME"
          MOUNT_DIR="${{ github.workspace }}/jellyfin-config"

          docker stop jellyfin || true
          sync

          echo "✂️ Trimming filesystem inside LUKS..."
          sudo fstrim -v "$MOUNT_DIR" || true

          sudo umount "$MOUNT_DIR" || true
          sudo cryptsetup close encrypted_vol || true
          sudo qemu-nbd --disconnect /dev/nbd0 || true

          echo "🗜️ Compressing qcow2 image..."
          mkdir -p /tmp/hf-backup
          qemu-img convert -O qcow2 -c "$IMG_PATH" "/tmp/hf-backup/$IMG_NAME"

          SIZE=$(du -sh "/tmp/hf-backup/$IMG_NAME" | cut -f1)
          echo "📦 Final encrypted size for upload: $SIZE"

          hf auth login --token "$HFGAG_TOKEN"
          echo "☁️ Uploading encrypted backup to Public HF Repo ($PUBLIC_REPO)..."
          hf sync "/tmp/hf-backup" "hf://$PUBLIC_REPO"
